# The desktop CI (GO-DESKTOP-IMPLEMENTATION-GUIDE.md §9 + WINDOWS-PACKAGING-PLAN §7).
# Conventions inherited from the verified web CI (hibana-source ci.yml):
# pinned toolchains, frozen deps, timeouts, failure-only artifacts, tag-driven Releases.
#
# TWO island gates (WPP §7.4 — the highest-value check of the separate-repo design):
#   1. CHECKSUM gate (always): the committed frontend/dist must be byte-identical
#      to the committed island.checksums.json — catches any hand-edit.
#   2. PINNED-REF gate (needs HIBANA_SOURCE_TOKEN — hibana-source is PRIVATE):
#      a fresh sync from hibana-source AT THE PIN must reproduce the same
#      checksums — catches a drifted/dishonestly re-checksummed island.

name: desktop

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  WEB_REF: e6661c8          # the island pin (must match scripts/sync-island.mjs)
  WEB_VERSION: "0.4.1.35"   # the pin's package version (Release notes carry BOTH)

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod   # honors the toolchain pin
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22          # the island-sync + checksum scripts only

      # 1a. The checksum gate — no external access needed.
      - name: Island checksum gate
        run: node scripts/sync-island.mjs --ref $env:WEB_REF --check

      # 1b. The pinned-ref gate — hibana-source is a PRIVATE repo: the clone
      #     needs the PAT secret. Skipped (with a visible note) until the
      #     owner sets HIBANA_SOURCE_TOKEN in this repo's secrets.
      - name: Island pinned-ref gate
        if: env.HAS_SOURCE_TOKEN == 'true'
        env:
          HAS_SOURCE_TOKEN: ${{ secrets.HIBANA_SOURCE_TOKEN != '' }}
        run: |
          git clone --no-checkout https://x-access-token:${{ secrets.HIBANA_SOURCE_TOKEN }}@github.com/assadigit/hibana-source.git $env:RUNNER_TEMP\hibana-source
          $tmp = Join-Path $env:RUNNER_TEMP "island-fresh"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          node scripts/sync-island.mjs --ref $env:WEB_REF --src $env:RUNNER_TEMP\hibana-source --out (Join-Path $tmp "dist")
          if (Compare-Object (Get-Content frontend\island.checksums.json) (Get-Content (Join-Path $tmp "island.checksums.json"))) {
            Write-Error "ISLAND DRIFT: a fresh sync at pin $env:WEB_REF does not reproduce the committed checksums"
          }
          Write-Host "pinned-ref gate OK: fresh sync at $env:WEB_REF reproduces the committed island byte-for-byte"

      # 2. Frozen deps + the pure-Go gates.
      - name: Verify + vet + test
        run: |
          go mod verify
          go vet ./...
          go test ./internal/...

      # 3. The wails CLI, pinned (guide §1.2 — the one external dependency
      #    whose minor versions move), + NSIS (guide §1.4 — wails build -nsis
      #    needs makensis on PATH or it silently SKIPS the installer with a
      #    warning, exactly what the first green run exposed).
      - name: Install wails CLI + NSIS
        run: |
          choco install nsis -y --no-progress   # NSIS 3.x — the nsis-unicode package is 2.46 (2011) and wails cannot find its makensis
          # choco's nsis package deploys makensis to Program Files (x86)\NSIS but does
          # NOT put it on PATH; the wails CLI resolves makensis via LookPath, so the
          # directory joins GITHUB_PATH (visible to every subsequent step).
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      # 4. The two artifacts — same binary, dual stamps (the never-diverge rule:
      #    tag, -X stamps, and wails.json info derive from ONE version source).
      - name: Build portable exe
        run: wails build -platform windows/amd64 -ldflags "-s -w -X main.Version=0.1.0 -X main.WebRef=$env:WEB_REF"

      - name: Build NSIS installer
        run: wails build -platform windows/amd64 -nsis -ldflags "-s -w -X main.Version=0.1.0 -X main.WebRef=$env:WEB_REF"

      - name: Portable zip + checksums
        run: |
          pwsh scripts/make-portable.ps1 -Version 0.1.0
          # Locate the three artifacts wherever wails put them (the NSIS
          # product lands in build/bin/) and hash them with Get-FileHash —
          # no name/location assumptions, sha256 lowercased like sha256sum.
          $artifacts = Get-ChildItem -Path 'build/bin/hibana.exe', 'build/bin/*installer*.exe', '*installer*.exe', 'hibana-portable-*.zip' -ErrorAction SilentlyContinue | Sort-Object FullName -Unique
          $artifacts | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $(Split-Path -Leaf $_.FullName)" } | Out-File checksums.txt -Encoding utf8
          Get-Content checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hibana-windows
          path: |
            build/bin/hibana.exe
            build/bin/*installer*.exe
            *installer*.exe
            hibana-portable-*.zip
            checksums.txt
          retention-days: 7
          if-no-files-found: error

  # Tag-driven release (v0.x.y-desktop tags → both artifacts + checksums +
  # notes carrying BOTH versions — desktop semver + embedded web ref, WPP §7.5).
  release:
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-desktop')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with: { name: hibana-windows }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          VER="${TAG#v}"; VER="${VER%-desktop}"
          gh release create "$TAG" --title "Hibana Kanban $VER (island @ $env:WEB_REF)" \
            --notes "Desktop $VER — embedded web island pinned at hibana-source $env:WEB_REF (v$env:WEB_VERSION). See checksums.txt." \
            *installer*.exe hibana-portable-*.zip checksums.txt
