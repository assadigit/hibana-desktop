# The desktop CI (GO-DESKTOP-IMPLEMENTATION-GUIDE.md §9 + WINDOWS-PACKAGING-PLAN §7).
# Conventions inherited from the verified web CI (hibana-source ci.yml):
# pinned toolchains, frozen deps, timeouts, failure-only artifacts, tag-driven Releases.
#
# TWO island gates (WPP §7.4 — the highest-value check of the separate-repo design):
#   1. CHECKSUM gate (always): the committed frontend/dist must be byte-identical
#      to the committed island.checksums.json — catches any hand-edit.
#   2. PINNED-REF gate (needs HIBANA_SOURCE_TOKEN — hibana-source is PRIVATE):
#      a fresh sync from hibana-source AT THE PIN must reproduce the same
#      checksums — catches a drifted/dishonestly re-checksummed island.

name: desktop

on:
  push:
    branches: [main]
    tags: ['v*-desktop']   # the release lane below is tag-driven — without this filter a tag push never triggers the workflow
  workflow_dispatch: {}

env:
  WEB_REF: e6661c8          # the island pin (must match scripts/sync-island.mjs)
  WEB_VERSION: "0.4.1.35"   # the pin's package version (Release notes carry BOTH)

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod   # honors the toolchain pin
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22          # the island-sync + checksum scripts only

      # 1a. The checksum gate — no external access needed.
      - name: Island checksum gate
        run: node scripts/sync-island.mjs --ref $env:WEB_REF --check

      # 1b. The pinned-ref gate — hibana-source is a PRIVATE repo: the clone
      #     needs the PAT secret. Skipped (with a visible note) until the
      #     owner sets HIBANA_SOURCE_TOKEN in this repo's secrets.
      - name: Island pinned-ref gate
        if: env.HAS_SOURCE_TOKEN == 'true'
        env:
          HAS_SOURCE_TOKEN: ${{ secrets.HIBANA_SOURCE_TOKEN != '' }}
        run: |
          git clone --no-checkout https://x-access-token:${{ secrets.HIBANA_SOURCE_TOKEN }}@github.com/assadigit/hibana-source.git $env:RUNNER_TEMP\hibana-source
          $tmp = Join-Path $env:RUNNER_TEMP "island-fresh"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          node scripts/sync-island.mjs --ref $env:WEB_REF --src $env:RUNNER_TEMP\hibana-source --out (Join-Path $tmp "dist")
          if (Compare-Object (Get-Content frontend\island.checksums.json) (Get-Content (Join-Path $tmp "island.checksums.json"))) {
            Write-Error "ISLAND DRIFT: a fresh sync at pin $env:WEB_REF does not reproduce the committed checksums"
          }
          Write-Host "pinned-ref gate OK: fresh sync at $env:WEB_REF reproduces the committed island byte-for-byte"

      # 2. Frozen deps + the pure-Go gates.
      - name: Verify + vet + test
        run: |
          go mod verify
          go vet ./...
          go test ./internal/...

      # 3. The wails CLI, pinned (guide §1.2 — the one external dependency
      #    whose minor versions move), + NSIS (guide §1.4 — wails build -nsis
      #    needs makensis on PATH or it silently SKIPS the installer with a
      #    warning, exactly what the first green run exposed).
      - name: Install wails CLI + NSIS
        run: |
          # NSIS 3.x — the nsis-unicode choco package is 2.46 (2011); wails needs makensis on
          # PATH or it SILENTLY skips the installer (S211's documented trap).
          # choco's community V2 feed went hard-down mid-session (runs #13/#15: "Unable to
          # find package 'nsis'" 5/5 attempts, pwsh swallows the exit; the feed even serves
          # the nsis nupkg metadata-only, so there is no offline side-door through choco's
          # CDN) — so: one choco attempt, then the DETERMINISTIC fallback: the official
          # NSIS 3.13 portable zip from SourceForge (the exact binary the winget manifest
          # ships; verified layout nsis-3.13/makensis.exe + Stubs — NSIS is portable by
          # design). Every path VERIFIES makensis.exe; the product asserts stay downstream.
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          Write-Host 'choco nsis install attempt 1'
          choco install nsis -y --no-progress
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            Write-Host 'choco V2 feed unavailable — falling back to the official NSIS 3.13 portable zip'
            $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
            curl.exe -L --fail --retry 3 --retry-delay 5 -o $zip 'https://sourceforge.net/projects/nsis/files/NSIS%203/3.13/nsis-3.13.zip/download'
            $dst = Join-Path $env:RUNNER_TEMP 'NSIS-313'
            Expand-Archive -Path $zip -DestinationPath $dst -Force
            $nsisDir = Join-Path $dst 'nsis-3.13'
          }
          if (-not (Test-Path (Join-Path $nsisDir 'makensis.exe'))) {
            Write-Error "makensis.exe still missing after choco + the official zip fallback ($nsisDir)"
            exit 1
          }
          # makensis is NOT put on PATH by choco; the wails CLI resolves it via LookPath,
          # so the directory joins GITHUB_PATH (visible to every subsequent step).
          Add-Content $env:GITHUB_PATH $nsisDir
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      # 4. The two artifacts — same binary, dual stamps (the never-diverge rule:
      #    tag, -X stamps, and wails.json info derive from ONE version source).
      #    The tag IS that source: v0.1.1-desktop → 0.1.1 everywhere. Branch
      #    builds stamp the dev placeholder instead.
      - name: Derive the build version (hard rule 9)
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = ($env:GITHUB_REF -replace '^refs/tags/v', '') -replace '-desktop$', ''
          } else {
            $v = '0.1.4-dev'
          }
          Add-Content $env:GITHUB_ENV "BUILD_VERSION=$v"
          Write-Host "BUILD_VERSION=$v"

      - name: Build portable exe
        run: wails build -platform windows/amd64 -ldflags "-s -w -X main.Version=$env:BUILD_VERSION -X main.WebRef=$env:WEB_REF"

      - name: Build NSIS installer
        run: |
          wails build -platform windows/amd64 -nsis -ldflags "-s -w -X main.Version=$env:BUILD_VERSION -X main.WebRef=$env:WEB_REF"
          # wails exits 0 with a mere warning when makensis is missing — assert the PRODUCT.
          $installer = Get-ChildItem -Path 'build/bin','.' -Filter '*installer*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { Write-Error "NSIS installer not produced (wails silently skipped — makensis missing?)"; exit 1 }
          Write-Host "installer produced: $($installer.FullName)"

      - name: Portable zip + checksums
        run: |
          pwsh scripts/make-portable.ps1 -Version $env:BUILD_VERSION
          # Locate the three artifacts wherever wails put them (the NSIS
          # product lands in build/bin/) and hash them with Get-FileHash —
          # no name/location assumptions, sha256 lowercased like sha256sum.
          $artifacts = Get-ChildItem -Path 'build/bin/hibana.exe', 'build/bin/*installer*.exe', '*installer*.exe', 'hibana-portable-*.zip' -ErrorAction SilentlyContinue | Sort-Object FullName -Unique
          $found = @($artifacts)
          if ($found.Count -lt 3) {
            Write-Error "expected 3 artifacts (exe + installer + portable zip), found $($found.Count): $($found.FullName -join ', ')"
            exit 1
          }
          $artifacts | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $(Split-Path -Leaf $_.FullName)" } | Out-File checksums.txt -Encoding utf8
          Get-Content checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hibana-windows
          path: |
            build/bin/hibana.exe
            build/bin/*installer*.exe
            *installer*.exe
            hibana-portable-*.zip
            checksums.txt
          retention-days: 7
          if-no-files-found: error

  # Tag-driven release (v0.x.y-desktop tags → both artifacts + checksums +
  # notes carrying BOTH versions — desktop semver + embedded web ref, WPP §7.5).
  release:
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-desktop')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # gh release create needs write — new-repo default GITHUB_TOKEN is read-only contents
    steps:
      - uses: actions/download-artifact@v4
        with: { name: hibana-windows }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job deliberately has NO checkout (download-artifact fills the
          # workspace) — gh's git-based repo detection fails without a .git dir
          # ("failed to run git: fatal: not a git repository"), run#17's lesson.
          # GH_REPO makes the release call pure API, no git context needed.
          GH_REPO: assadigit/hibana-desktop
        run: |
          TAG="${GITHUB_REF##*/}"
          VER="${TAG#v}"; VER="${VER%-desktop}"
          # ubuntu-latest runs bash, not pwsh: $env:WEB_REF is PowerShell syntax and
          # expands to a literal ":WEB_REF" here — the workflow-level env is plain $WEB_REF.
          # First live exercise (v0.1.0-desktop, run 39270204244) taught: `no matches
          # found for build/bin/*installer*.exe` — download-artifact@v4's extraction
          # carried no build/bin/ subpath. Assume NO layout: locate each asset wherever
          # it landed, fail loudly with a dump if any is missing.
          INSTALLER="$(find . -type f -name '*installer*.exe' -print -quit)"
          PORTABLE="$(find . -type f -name 'hibana-portable-*.zip' -print -quit)"
          CKSUM="$(find . -type f -name 'checksums.txt' -print -quit)"
          if [ -z "$INSTALLER" ] || [ -z "$PORTABLE" ] || [ -z "$CKSUM" ]; then
            echo "::error::release assets missing after download (installer='$INSTALLER' portable='$PORTABLE' checksums='$CKSUM'); extracted layout:"
            find . -type f | head -50
            exit 1
          fi
          gh release create "$TAG" --title "Hibana Kanban $VER (island @ $WEB_REF)" \
            --notes "Desktop $VER — embedded web island pinned at hibana-source $WEB_REF (v$WEB_VERSION). NEW in $VER: THE PROJECT SWITCHER FIX — changing projects said \"Couldn't load the board — try again\" and never recovered; the sync engine's cached If-None-Match validator was riding the board's own fetch, so the server answered 304 to a renderer with no cached copy. Interactive fetches are now always fresh (no conditional polling) — switching projects loads every board reliably. Bridge failures also log to data/logs/hibana.log now. Minimize to tray (from $VER's predecessor): the Hibana icon sits in the notification area; the close button hides to the tray with a persisted toggle; left-click or a second exe launch restores. Sign in with your hibana.ir account; once you sign in, the kanban loads, and a live session boots straight to the board. See checksums.txt." \
            "$INSTALLER" "$PORTABLE" "$CKSUM"
